name: Update backend epic1 Image

on:
  repository_dispatch:
    types: [update-backend-epic1]

jobs:
  update-backend-epic1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_PUSH_TOKEN }}

      - name: Extract payload data
        id: extract
        env:
          IMAGE: ${{ github.event.client_payload.image }}
        run: |
          echo "New image: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update backend epic1 deployment
        env:
          IMAGE: ${{ steps.extract.outputs.image }}
        run: |
          FILE="backend/epic1/deployment.yml"

          if [ ! -f "$FILE" ]; then
            echo "Error: $FILE does not exist"
            exit 1
          fi

          echo "Updating $FILE to use $IMAGE"
          sed -i "s|image: .*|image: ${IMAGE}|" "$FILE"
          grep "image:" "$FILE"

      - name: Commit and push changes
        env:
          IMAGE: ${{ steps.extract.outputs.image }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/epic1/deployment.yml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update backend epic1 image to ${IMAGE}"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::Deployment update conflicts with changes on main."
                exit 1
              fi

              if git push origin HEAD:main; then
                break
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "::error::Could not push deployment update after 5 attempts."
                exit 1
              fi

              echo "Push failed; refreshing main before retry $((attempt + 1))."
              sleep "$attempt"
            done
          fi
