apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umssy-epic1-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UMSSY/umssy-app-deploy.git
    targetRevision: main
    path: backend/epic1
  destination:
    server: https://kubernetes.default.svc
    namespace: umssy-epic1
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
