apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umssy-epic6-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UMSSY/umssy-app-deploy.git
    targetRevision: main
    path: frontend/epic6
  destination:
    server: https://kubernetes.default.svc
    namespace: umssy-epic6
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
