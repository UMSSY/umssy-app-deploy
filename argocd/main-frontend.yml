apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umssy-main-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UMSSY/umssy-app-deploy.git
    targetRevision: main
    path: frontend/main
  destination:
    server: https://kubernetes.default.svc
    namespace: umssy-main
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
