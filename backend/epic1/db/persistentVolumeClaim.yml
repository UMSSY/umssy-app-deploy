apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  namespace: umssy-epic1
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path-homehdd
  resources:
    requests:
      storage: 10Gi
