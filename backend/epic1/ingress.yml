apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umssy-backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  namespace: umssy-epic1
spec:
  ingressClassName: traefik
  rules:
  - host: epic1-api-umssy.zer4c.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: umssy-backend
            port:
              number: 8080
