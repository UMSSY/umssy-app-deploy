apiVersion: apps/v1
kind: Deployment
metadata:
  name: umssy-frontend
  namespace: umssy-develop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umssy-frontend
  template:
    metadata:
      labels:
        app: umssy-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/umssy/umssy-app-frontend:develop-d7358c5c1812f1a81e5559026788d0229a552fdc
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '3000'
