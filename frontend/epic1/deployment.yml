apiVersion: apps/v1
kind: Deployment
metadata:
  name: umssy-frontend
  namespace: umssy-epic1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umssy-frontend
  template:
    metadata:
      labels:
        app: umssy-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/umssy/umssy-app-frontend:epic1-1fb7c4345458a5fb6381e371f1b0fbf2548dbf00
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '3000'
