apiVersion: apps/v1
kind: Deployment
metadata:
  name: umssy-frontend
  namespace: umssy-epic1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umssy-frontend
  template:
    metadata:
      labels:
        app: umssy-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/umssy/umssy-app-frontend:epic1-f9191a6faa9947f2f4ff4f6c1381396f8b9ea720
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '3000'
