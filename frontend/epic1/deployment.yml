apiVersion: apps/v1
kind: Deployment
metadata:
  name: umssy-frontend
  namespace: umssy-epic1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umssy-frontend
  template:
    metadata:
      labels:
        app: umssy-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/umssy/umssy-app-frontend:epic1-bee63c39d0a6c83f1c03179eda7c03ae4c0d9d3d
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '3000'
