apiVersion: apps/v1
kind: Deployment
metadata:
  name: umssy-frontend
  namespace: umssy-epic6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umssy-frontend
  template:
    metadata:
      labels:
        app: umssy-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/umssy/umssy-app-frontend:epic6-a43aee7234aa6ebf5b3742d71cdf39c00b1beb6b
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '3000'
